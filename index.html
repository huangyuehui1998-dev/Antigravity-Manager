<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Tools</title>
  <script>
    (function () {
      try {
        const isMini = window.location.search.includes('mini') || 
                       (typeof window !== 'undefined' && window.__TAURI_INTERNALS__?.metadata?.currentWindow?.label === 'mini');
        const savedTheme = localStorage.getItem('app-theme-preference');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const shouldBeDark = savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && systemDark);

        if (isMini) {
          document.documentElement.classList.add('mini-window');
          document.documentElement.style.backgroundColor = 'transparent';
        } else {
          document.documentElement.style.backgroundColor = shouldBeDark ? '#0B0F17' : '#FAFBFC';
        }

        if (shouldBeDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        console.error('Failed to apply theme during boot:', e);
      }
    })();
  </script>
  <style>
    /* Critical CSS: Prevent cold start flash by aligning initial background */
    html:not(.mini-window) {
      background-color: #FAFBFC;
    }
    html.dark:not(.mini-window) {
      background-color: #0B0F17 !important;
    }

    html.mini-window,
    html.mini-window body,
    body.mini-window {
      background-color: transparent !important;
      background: transparent !important;
    }

    body {
      margin: 0;
      background-color: transparent;
    }
  </style>
</head>

<body style="margin: 0;">




  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
